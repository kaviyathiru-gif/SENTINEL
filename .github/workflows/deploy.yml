name: Deploy SENTINEL Cyber Defense Dashboard to GitHub Pages

on:
  # Triggers the workflow on push requests targeting the main branch
  push:
    branches:
      - main

  # Allows manual execution of this workflow from the Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and validation job
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Validate Project Structure & Core Files
        run: |
          echo "Verifying SENTINEL application files..."
          if [ ! -f "index.html" ]; then
            echo "Error: index.html missing from root directory!"
            exit 1
          fi
          echo "Root index.html verified successfully."

      - name: Upload Build Artifact for Deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Automated deployment job to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
