<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Eye High-Res PNG Generator</title>
  <style>
    body {
      background: #06040a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
    }
    canvas {
      width: 400px;
      height: 400px;
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.3);
      border: 1px solid rgba(147, 51, 234, 0.4);
    }
    .btn {
      background: linear-gradient(135deg, #9333ea, #06b6d4);
      color: white;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
    }
  </style>
</head>
<body>

  <!-- High-Resolution Canvas (2048 x 2048) -->
  <canvas id="eyeLogoCanvas" width="2048" height="2048"></canvas>
  <button class="btn" onclick="downloadHighResPng()">Download cyber-eye-logo.png</button>

  <script>
    function drawCyberEyeLogo() {
      const canvas = document.getElementById('eyeLogoCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;

      ctx.clearRect(0, 0, w, h);

      // 1. Deep Cyber Dark Background Gradient
      const bgGrad = ctx.createRadialGradient(cx, cy, 100, cx, cy, w * 0.7);
      bgGrad.addColorStop(0, '#0d0822');
      bgGrad.addColorStop(0.6, '#06040a');
      bgGrad.addColorStop(1, '#020105');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 2. Ambient Glow Accents (Purple / Cyan)
      const purpleGlow = ctx.createRadialGradient(w * 0.8, h * 0.8, 0, w * 0.8, h * 0.8, w * 0.4);
      purpleGlow.addColorStop(0, 'rgba(236, 72, 153, 0.25)');
      purpleGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = purpleGlow;
      ctx.fillRect(0, 0, w, h);

      // 3. Outer Neon Cyan Eye Lens Arcs
      ctx.save();
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 60;
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = w * 0.022;
      ctx.lineCap = 'round';

      // Top Outer Arc
      ctx.beginPath();
      ctx.moveTo(w * 0.16, cy);
      ctx.quadraticCurveTo(cx, h * 0.18, w * 0.84, cy);
      ctx.stroke();

      // Bottom Outer Arc
      ctx.beginPath();
      ctx.moveTo(w * 0.16, cy);
      ctx.quadraticCurveTo(cx, h * 0.82, w * 0.84, cy);
      ctx.stroke();
      ctx.restore();

      // 4. Inner Secondary Eye Contour
      ctx.save();
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.7)';
      ctx.lineWidth = w * 0.008;

      ctx.beginPath();
      ctx.moveTo(w * 0.22, cy);
      ctx.quadraticCurveTo(cx, h * 0.26, w * 0.78, cy);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(w * 0.22, cy);
      ctx.quadraticCurveTo(cx, h * 0.74, w * 0.78, cy);
      ctx.stroke();
      ctx.restore();

      // 5. Vertical Binary Data Text (1001 001010) on Left Wing
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 25;
      ctx.font = `bold ${w * 0.024}px "Fira Code", monospace`;
      ctx.translate(w * 0.27, cy - h * 0.05);
      ctx.rotate(-Math.PI / 3);
      ctx.fillText('1001 001010', 0, 0);
      ctx.restore();

      // 6. Central Rotating Mechanical Iris Ring
      ctx.save();
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 50;
      ctx.fillStyle = '#090d24';
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = w * 0.01;

      ctx.beginPath();
      ctx.arc(cx, cy, w * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // 7. Tech HUD Dash Rings
      ctx.save();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = w * 0.006;
      ctx.setLineDash([w * 0.04, w * 0.02, w * 0.08, w * 0.015]);
      ctx.beginPath();
      ctx.arc(cx, cy, w * 0.175, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = w * 0.004;
      ctx.setLineDash([w * 0.02, w * 0.01, w * 0.05]);
      ctx.beginPath();
      ctx.arc(cx, cy, w * 0.15, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 8. Aperture Core Base
      ctx.save();
      ctx.fillStyle = '#090617';
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = w * 0.006;
      ctx.beginPath();
      ctx.arc(cx, cy, w * 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // 9. Central Shield & Five-Pointed Star Core
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#091833';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = w * 0.006;

      const sw = w * 0.12;
      const sh = h * 0.15;
      ctx.beginPath();
      ctx.moveTo(cx, cy - sh * 0.5);
      ctx.lineTo(cx + sw * 0.5, cy - sh * 0.3);
      ctx.lineTo(cx + sw * 0.5, cy + sh * 0.1);
      ctx.quadraticCurveTo(cx + sw * 0.5, cy + sh * 0.5, cx, cy + sh * 0.65);
      ctx.quadraticCurveTo(cx - sw * 0.5, cy + sh * 0.5, cx - sw * 0.5, cy + sh * 0.1);
      ctx.lineTo(cx - sw * 0.5, cy - sh * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Draw Star inside Shield
      drawStar(ctx, cx, cy + h * 0.01, 5, w * 0.035, w * 0.017, '#ffffff');
      ctx.restore();

      // 10. Specular Lens Flare Reflection
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.arc(cx + w * 0.06, cy - h * 0.07, w * 0.025, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, fillStyle) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      let step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }

    function downloadHighResPng() {
      const canvas = document.getElementById('eyeLogoCanvas');
      const link = document.createElement('a');
      link.download = 'cyber-eye-logo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.onload = drawCyberEyeLogo;
  </script>

</body>
</html>
