<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentinel Splash Background Generator</title>
  <style>
    body {
      background: #06040a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
    }
    canvas {
      width: 600px;
      height: 337.5px;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(147, 51, 234, 0.35);
      border: 1px solid rgba(42, 34, 74, 0.8);
    }
    .btn {
      background: linear-gradient(135deg, #9333ea, #06b6d4);
      color: white;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
    }
  </style>
</head>
<body>

  <!-- High-Resolution 4K Canvas for Backdrop Asset (3840x2160) -->
  <canvas id="bgCanvas" width="3840" height="2160"></canvas>
  <button class="btn" onclick="downloadSplashBgJpg()">Download splash-bg.jpg</button>

  <script>
    function renderSplashBackground() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;

      // 1. Deep Core Dark Background Gradient
      const baseGrad = ctx.createRadialGradient(cx, cy, w * 0.1, cx, cy, w * 0.7);
      baseGrad.addColorStop(0, '#0d091f');
      baseGrad.addColorStop(0.5, '#07050e');
      baseGrad.addColorStop(1, '#020105');
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, w, h);

      // 2. Large Volumetric Ambient Glow Orbs
      function drawGlowOrb(x, y, radius, colorStop0, colorStop1) {
        ctx.save();
        const orbGrad = ctx.createRadialGradient(x, y, 0, x, y, radius);
        orbGrad.addColorStop(0, colorStop0);
        orbGrad.addColorStop(1, colorStop1);
        ctx.fillStyle = orbGrad;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Center Eye Core Aura (Cyan/Purple Blend)
      drawGlowOrb(cx, cy, w * 0.35, 'rgba(147, 51, 234, 0.25)', 'transparent');
      drawGlowOrb(cx, cy, w * 0.2, 'rgba(6, 182, 212, 0.2)', 'transparent');

      // Corner Accents (Pink & Dark Indigo Glows)
      drawGlowOrb(w * 0.15, h * 0.2, w * 0.3, 'rgba(236, 72, 153, 0.12)', 'transparent');
      drawGlowOrb(w * 0.85, h * 0.8, w * 0.35, 'rgba(6, 182, 212, 0.12)', 'transparent');

      // 3. Cyber Matrix Grid Pattern
      ctx.save();
      ctx.strokeStyle = 'rgba(42, 34, 74, 0.3)';
      ctx.lineWidth = 2;
      const gridSize = 80;

      for (let x = 0; x <= w; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y <= h; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(w, y);
        ctx.stroke();
      }
      ctx.restore();

      // 4. Concentric Circular Radar/Tactical Ring Lines
      ctx.save();
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
      ctx.lineWidth = 3;
      ctx.setLineDash([20, 15, 60, 10]);

      [300, 600, 950, 1300].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      });
      ctx.restore();

      // 5. High-Density Ambient Particle Field & Constellation Lines
      const particles = [];
      const particleCount = 280;

      // Seed procedural particle positions
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          radius: Math.random() * 4 + 1.5,
          color: i % 3 === 0 ? '#06b6d4' : (i % 3 === 1 ? '#c084fc' : '#ec4899'),
          alpha: Math.random() * 0.7 + 0.3
        });
      }

      // Draw particle nodes
      particles.forEach(p => {
        ctx.save();
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Connect nearby particle nodes with digital neural constellation lines
      ctx.save();
      ctx.lineWidth = 1.5;
      for (let i = 0; i < particleCount; i++) {
        for (let j = i + 1; j < particleCount; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 180) {
            const lineAlpha = (1 - dist / 180) * 0.25;
            ctx.strokeStyle = particles[i].color;
            ctx.globalAlpha = lineAlpha;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    function downloadSplashBgJpg() {
      const canvas = document.getElementById('bgCanvas');
      const link = document.createElement('a');
      link.download = 'splash-bg.jpg';
      // Convert to JPG format at high quality (0.95)
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    }

    window.onload = renderSplashBackground;
  </script>

</body>
</html>
