<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PyTorch Inference</title>
</head>
<body>
    <h2>PyTorch Model Prediction</h2>
    <form id="predictionForm">
        <label for="inputData">Input Value:</label>
        <input type="number" step="any" id="inputData" required>
        <button type="submit">Predict</button>
    </form>

    <h3>Result: <span id="result">-</span></h3>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputVal = parseFloat(document.getElementById('inputData').value);

            const response = await fetch('http://127.0.0.1:5000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ input: inputVal })
            });

            const data = await response.json();
            if (data.status === 'success') {
                document.getElementById('result').innerText = data.prediction;
            } else {
                document.getElementById('result').innerText = 'Error: ' + data.error;
            }
        });
    </script>
</body>
</html>
