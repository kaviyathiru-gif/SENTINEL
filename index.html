<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="navbar">
        <div class="brand">
            <!-- Update "eye-icon.png" with your actual icon image filename/path -->
            <img src="eye-icon.png" alt="Sentinel Eye Icon" class="brand-icon">
            <span class="brand-title">SENTINEL</span>
        </div>
        <nav class="nav-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Settings</a>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main class="main-content">
        <div class="globe-container">
            <!-- Your 3D globe / canvas goes here -->
            <div id="globe-placeholder"></div>
        </div>

        <div class="control-panel">
            <p class="instruction-text">Please select a target</p>
            <div class="button-group">
                <button class="btn">Focus</button>
                <button class="btn btn-primary">Analyze</button>
            </div>
        </div>
    </main>

    <footer class="footer-hint">
        <p>Drag & Drop files | Move mouse to orbit</p>
    </footer>

</body>
</html>
